<script>
var day = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];
var period = {morning: 'утром', day: 'днём', evening: 'вечером', night: 'ночью', day_day: 'день', day_night: 'ночь'};

var timeout = 60 * 60; // API call interval, sec
var max_cache_age_hours = 48; // Max cache age before hiding weather, hours
var max_cache_age_ms = 48 * 60 * 60 * 1000;
var expire = 60 * 60 * 48; // Data expire for sectors, sec

var value = {};
var lastcall = 0;
var current_weather_data = null;

function icon_daynight(icon, sunrise, sunset) {
	// Дневной/ночной вариант значка (_d/_n) по фактическому времени суток
	try {
		if (!icon) return icon;
		if (!/(_d|_n)$/.test(icon)) return icon;
		var now = new Date(), m = now.getHours() * 60 + now.getMinutes();
		var sr = null, ss = null;
		if (sunrise) { var a = String(sunrise).split(":"); sr = (+a[0]) * 60 + (+a[1]); }
		if (sunset) { var b = String(sunset).split(":"); ss = (+b[0]) * 60 + (+b[1]); }
		if (sr === null || ss === null || isNaN(sr) || isNaN(ss)) {
			sr = 8 * 60; ss = 20 * 60;
		}
		var night = (m < sr || m >= ss);
		return icon.slice(0, -2) + (night ? "_n" : "_d");
	} catch (e) { return icon; }
}

function format_time(ts, with_sec, with_year) {
	if (!ts) return "—";
	var d = new Date(Number(ts));
	if (isNaN(d.getTime())) return "—";
	var datePart = pad(d.getDate()) + "." + pad(d.getMonth() + 1);
	if (with_year) datePart += "." + d.getFullYear();
	var res = datePart + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
	if (with_sec) res += ":" + pad(d.getSeconds());
	return res;
}

function format_error_reason(xhr, status, err, source_name) {
	if (status === "no_server_url" || status === "source_disabled") {
		return err || "источник отключён";
	}
	if (!source_name) source_name = "сервер";
	if (xhr && xhr.status === 403) {
		if (source_name === "сервер") return "исчерпан суточный лимит запросов Яндекс.Погоды (ошибка 403)";
		return "ошибка источника " + source_name + " (код 403)";
	} else if (xhr && xhr.status === 429) {
		if (source_name === "сервер") return "превышен лимит частоты запросов к Яндекс.Погоде (ошибка 429)";
		return "превышен лимит частоты запросов " + source_name + " (ошибка 429)";
	} else if (!xhr || xhr.status === 0 || status === "timeout") {
		return "нет связи с " + source_name + " (таймаут или сеть)";
	} else if (xhr && xhr.status >= 500) {
		return "сбой на сервере " + (source_name === "сервер" ? "Яндекса" : source_name) + " (код " + xhr.status + ")";
	} else if (xhr && xhr.status) {
		return "ошибка API (код " + xhr.status + ")";
	} else {
		return "ошибка сети (" + (status || err || "неизвестно") + ")";
	}
}

function safe_get_item(key, fallback) {
	try {
		var val = localStorage.getItem(key);
		return val !== null ? val : (fallback || "");
	} catch (e) {
		return fallback || "";
	}
}

function safe_set_item(key, val) {
	try {
		localStorage.setItem(key, String(val));
	} catch (e) {}
}

function update_status_bar() {
	var cacheTime = parseInt(safe_get_item("weather_cache_time", "0"), 10);
	var cacheSource = safe_get_item("weather_cache_source", "Яндекс.Погода");
	var lastAttemptTime = parseInt(safe_get_item("weather_last_attempt_time", "0"), 10);
	var lastError = safe_get_item("weather_last_attempt_error", "");
	var now = Date.now();

	var isStale = (cacheTime === 0) || (now - cacheTime > max_cache_age_ms);

	if (isStale) {
		$("#weather_body").addClass("stale_hidden");
		$("#wrapper").addClass("weather_stale");

		var ageDays = Math.round(max_cache_age_hours / 24);
		var msg = "⚠️ Погода не обновлялась более " + (ageDays >= 1 ? (ageDays + " суток") : (max_cache_age_hours + " ч")) + " (данные устарели и скрыты)";
		if (lastAttemptTime > 0) {
			msg += " • Последняя попытка: " + format_time(lastAttemptTime, true);
		}
		if (lastError) {
			msg += " — " + lastError;
		}
		if (cacheTime > 0) {
			msg += " • Обновлено: " + format_time(cacheTime, false, true) + " • Источник: " + cacheSource;
		}
		$("#status_bar")
			.text(msg)
			.addClass("visible")
			.addClass("status_stale")
			.addClass("status_error")
			.removeClass("status_warn")
			.removeClass("status_normal");
	} else {
		$("#weather_body").removeClass("stale_hidden");
		$("#wrapper").removeClass("weather_stale");

		if (lastError) {
			var msg = "⚠️ Погода не обновилась: " + lastError;
			if (lastAttemptTime > 0) {
				msg += " • Последняя попытка: " + format_time(lastAttemptTime, true);
			}
			if (cacheTime > 0) {
				msg += " • Обновлено: " + format_time(cacheTime, false, true) + " • Источник: " + cacheSource;
			}
			$("#status_bar")
				.text(msg)
				.addClass("visible")
				.addClass("status_warn")
				.removeClass("status_stale")
				.removeClass("status_error")
				.removeClass("status_normal");
		} else {
			var updateStr = cacheTime > 0 ? format_time(cacheTime, false, true) : "—";
			var sourceStr = cacheTime > 0 ? cacheSource : "—";
			var msg = "Обновлено: " + updateStr + " • Источник: " + sourceStr;
			$("#status_bar")
				.text(msg)
				.addClass("visible")
				.addClass("status_normal")
				.removeClass("status_warn")
				.removeClass("status_stale")
				.removeClass("status_error");
		}
	}
}

function update_viewport_metrics() {
	var winW = window.innerWidth;
	var winH = window.innerHeight;
	var screenH = window.screen.height;
	var hasTopBar = (screenH > winH) && (screenH - winH >= 16);

	if (hasTopBar) {
		document.documentElement.classList.add("has_system_bar");
	} else {
		document.documentElement.classList.remove("has_system_bar");
	}

	var ratio = winW / winH;
	if (ratio <= 1.68 || winH >= 680) {
		document.documentElement.classList.add("screen_tall");
		document.documentElement.classList.remove("screen_wide");
	} else {
		document.documentElement.classList.add("screen_wide");
		document.documentElement.classList.remove("screen_tall");
	}
}

function show_error(xhr, status, err, source_name) {
	var reason = format_error_reason(xhr, status, err, source_name);
	try {
		localStorage.setItem("weather_last_attempt_error", reason);
	} catch(e) {}
	update_status_bar();
}

function hide_error() {
	try {
		localStorage.removeItem("weather_last_attempt_error");
	} catch(e) {}
	update_status_bar();
}

function init_menu() {
	var menu = $("#weather_menu");
	function render_src() {
		var pref = safe_get_item("weather_source_pref", "default");
		if (pref !== "server" && pref !== "wttr" && pref !== "owm" && pref !== "yandex") pref = "default";
		$(".menu_src").each(function() {
			var src = $(this).attr("data-src");
			if (src === "yandex" && !allow_direct_yandex) { $(this).hide(); return; }
			$(this).show();
			if (src === pref) $(this).addClass("menu_active");
			else $(this).removeClass("menu_active");
		});
	}
	$("#menu_btn").on("click", function(e) {
		e.stopPropagation();
		if (menu.hasClass("menu_open")) menu.removeClass("menu_open");
		else { render_src(); menu.addClass("menu_open"); }
	});
	menu.on("click", function(e) { e.stopPropagation(); });
	$("#menu_refresh").on("click", function(e) {
		e.stopPropagation();
		menu.removeClass("menu_open");
		console.log("Menu: forced weather refresh");
		get_data();
	});
	$(".menu_src").on("click", function(e) {
		e.stopPropagation();
		try {
			localStorage.setItem("weather_source_pref", String($(this).attr("data-src")));
		} catch (err) {}
		render_src();
	});
	function render_color() {
		var pref = safe_get_item("weather_text_color", "#ffffff");
		$(".menu_color").each(function() {
			if (String($(this).attr("data-color")).toLowerCase() === pref.toLowerCase()) $(this).addClass("menu_active");
			else $(this).removeClass("menu_active");
		});
	}
	render_color();
	$(".menu_color").on("click", function(e) {
		e.stopPropagation();
		var c = String($(this).attr("data-color"));
		try { localStorage.setItem("weather_text_color", c); } catch (err) {}
		apply_text_color(c);
		render_color();
	});
	$("#menu_close").on("click", function(e) {
		e.stopPropagation();
		menu.removeClass("menu_open");
	});
}

var server_url = ""; // Локальный сервер кэширования (если задан)
var owm_key = ""; // Ключ OpenWeatherMap для клиентского фолбэка

function apply_text_color(c) {
	try {
		if (c) document.documentElement.style.setProperty("--tc", c);
		else document.documentElement.style.removeProperty("--tc");
	} catch (e) {}
}
var allow_direct_yandex = false; // Прямой доступ планшета к Яндекс API: только явным разрешением в config.json (иначе расход квоты ключа)
var enable_wttr_fallback = true; // Резервный источник wttr.in

function load_config(callback) {
	$.getJSON("config.json")
		.done(function(cfg) {
			if (cfg.api) api = cfg.api;
			if (cfg.lat !== undefined) lat = cfg.lat;
			if (cfg.lon !== undefined) lon = cfg.lon;
			if (cfg.server_url !== undefined) server_url = cfg.server_url;
			if (cfg.openweathermap_api_key !== undefined) owm_key = cfg.openweathermap_api_key;
			var storedColor = safe_get_item("weather_text_color", "");
			apply_text_color(storedColor || cfg.text_color || "");
			if (cfg.timeout !== undefined) timeout = cfg.timeout;
			if (cfg.update_interval_sec !== undefined) timeout = cfg.update_interval_sec;
			if (cfg.max_cache_age_hours !== undefined) {
				max_cache_age_hours = Number(cfg.max_cache_age_hours);
				max_cache_age_ms = max_cache_age_hours * 60 * 60 * 1000;
				expire = max_cache_age_hours * 60 * 60;
			}
			if (cfg.enable_wttr_fallback !== undefined) {
				enable_wttr_fallback = Boolean(cfg.enable_wttr_fallback);
			}
			if (cfg.allow_direct_yandex !== undefined) {
				allow_direct_yandex = Boolean(cfg.allow_direct_yandex);
			}
			if (cfg.wind_max !== undefined) wind_max = cfg.wind_max;
			if (cfg.pressure_min !== undefined) pressure_min = cfg.pressure_min;
			if (cfg.pressure_max !== undefined) pressure_max = cfg.pressure_max;
			console.log("Loaded external config.json successfully:", cfg);
		})
		.fail(function() {
			console.log("config.json not found or parse error, using default settings");
		})
		.always(function() {
			if (callback) callback();
		});
}

var fetch_from_owm = function(on_success, on_error) {
	if (!owm_key) { on_error(null, "no_owm_key", "нет ключа OpenWeatherMap"); return; }
	var url = 'https://api.openweathermap.org/data/2.5/forecast?lat=' + lat + '&lon=' + lon + '&units=metric&appid=' + owm_key;
	$.getJSON(url)
		.done(function(om) {
			try {
				var blocks = (om.list || []).map(function(it) {
					var w = (it.weather && it.weather[0]) || {};
					var id = parseInt(w.id, 10) || 800;
					var base;
					if (id >= 200 && id < 300) base = 'ovc_ts';
					else if (id >= 300 && id < 600) base = 'ovc_ra';
					else if (id >= 600 && id < 700) base = 'ovc_sn';
					else if (id >= 700 && id < 800) base = 'ovc';
					else if (id === 800) base = 'skc';
					else if (id === 801 || id === 802) base = 'bkn';
					else base = 'ovc';
					var dn = (String(w.icon || 'd').slice(-1) === 'd') ? '_d' : '_n';
					var icon = (base === 'skc' || base === 'bkn') ? base + dn : base;
					return {
						date: String(it.dt_txt || '').substring(0, 10),
						hour: parseInt(String(it.dt_txt || '0000-00-00 00').substring(11, 13), 10) || 0,
						temp: Math.round((it.main && it.main.temp) || 0),
						icon: icon,
						wind_speed: Math.round((((it.wind || {}).speed) || 0) * 10) / 10,
						wind_angle: Math.round(((it.wind || {}).deg) || 180),
						humidity: (it.main && it.main.humidity) || 50,
						pressure_mm: Math.round((((it.main || {}).pressure) || 1013) * 0.750062)
					};
				});
				var today = blocks.length ? blocks[0].date : '';
				var byName = { morning: [], day: [], evening: [], night: [] };
				for (var i = 0; i < blocks.length; i++) {
					var b = blocks[i];
					if (b.date !== today) { if (b.hour < 6) byName.night.push(b); continue; }
					if (b.hour >= 6 && b.hour < 12) byName.morning.push(b);
					else if (b.hour >= 12 && b.hour < 18) byName.day.push(b);
					else if (b.hour >= 18) byName.evening.push(b);
					else byName.night.push(b);
				}
				var factB = blocks.length ? blocks[0] : null;
				var parts = {};
				['morning', 'day', 'evening', 'night'].forEach(function(name) {
					var arr = byName[name];
					var b = arr.length ? arr[Math.floor(arr.length / 2)] : null;
					parts[name] = {
						temp_avg: b ? b.temp : 0,
						icon: b ? b.icon : 'bkn_d',
						wind_speed: b ? b.wind_speed : 0,
						wind_angle: b ? b.wind_angle : 180
					};
				});
				var city = om.city || {};
				var sr = new Date((city.sunrise || 0) * 1000);
				var ss = new Date((city.sunset || 0) * 1000);
				var fH = function(d) { return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes(); };
				var converted = {
					fact: {
						temp: factB ? factB.temp : 0,
						icon: factB ? factB.icon : 'bkn_d',
						wind_speed: factB ? factB.wind_speed : 0,
						wind_angle: factB ? factB.wind_angle : 180,
						humidity: factB ? factB.humidity : 50,
						pressure_mm: factB ? factB.pressure_mm : 750
					},
					forecasts: [{
						sunrise: fH(sr), sunset: fH(ss), moon_code: 9,
						hours: blocks.filter(function(b) { return b.date === today; }).map(function(b) { return { hour: String(b.hour), temp: b.temp }; }),
						parts: parts
					}, { parts: parts }]
				};
				on_success(converted);
			} catch (ex) {
				console.error('OWM parse error:', ex);
				on_error(null, 'parse_error', ex ? ex.message : 'parse error');
			}
		})
		.fail(function(xhr, status, err) {
			console.log('OWM request failed:', status, err);
			on_error(xhr, status, err);
		});
};

function fetch_from_wttr(on_success, on_error) {
	var wt_url = 'https://wttr.in/' + lat + ',' + lon + '?format=j1';

	console.log("wttr.in fallback request:", wt_url);

	$.ajax({
		url: wt_url,
		dataType: 'json',
		timeout: 20 * 1000,
		success: function(wt) {
			try {
				var cc = (wt.current_condition && wt.current_condition[0]) ? wt.current_condition[0] : {};
				var days = wt.weather || [];
				var today = days[0] || {};
				var hourly = today.hourly || [];

				var get_wttr_icon = function(code, isDay) {
					// имена значков = словарь сервера: суффикс _d/_n только у skc/bkn
					var c = parseInt(code, 10) || 116;
					var s = (c === 113 || c === 116) ? (isDay ? "_d" : "_n") : "";
					if (c === 113) return "skc" + s;
					if (c === 200 || c === 386 || c === 389) return "ovc_ts";
					if (c === 179 || c === 182 || c === 185 || c === 227 || c === 230 || c === 320 || c === 323 || c === 325 || c === 326 || c === 328 || c === 329 || c === 331 || c === 332 || c === 334 || c === 335 || c === 338 || c === 350 || (c >= 362 && c <= 371) || c === 374 || c === 377) return "ovc_sn";
					if (c === 176 || c === 263 || c === 266 || c === 281 || c === 284 || c === 293 || c === 296 || c === 299 || c === 302 || c === 305 || c === 308 || c === 353 || c === 356 || c === 359) return "ovc_ra";
					if (c === 143 || c === 248 || c === 260) return "ovc";
					if (c === 119 || c === 122) return "ovc";
					return "bkn" + s;
				};

				var fmt12 = function(s) {
					if (!s) return "";
					var p = String(s).split(" ");
					var hm = p[0] ? p[0].split(":") : ["6", "00"];
					var h = parseInt(hm[0], 10) || 0;
					if (p[1] === "PM" && h < 12) h += 12;
					if (p[1] === "AM" && h === 12) h = 0;
					return (h < 10 ? "0" : "") + h + ":" + hm[1];
				};

				var iv = function(x, fb) {
					var n = parseInt(x, 10);
					return isNaN(n) ? fb : n;
				};

				var temp = Math.round(iv(cc.temp_C, 0));
				var wind_speed = Math.round((iv(cc.windspeedKmph, 0) / 3.6) * 10) / 10;
				var wind_angle = Math.round(iv(cc.winddirDegree, 0));
				var humidity = Math.round(iv(cc.humidity, 50));
				var pressure_mm = Math.round((iv(cc.pressure, 1013)) * 0.750062);

				var hourNow = new Date().getHours();
				var icon = get_wttr_icon(cc.weatherCode, (hourNow >= 8 && hourNow < 20));

				var daysCount = Math.min(days.length, 3);
				var forecasts_list = [];
				for (var d = 0; d < daysCount; d++) {
					var day = days[d];
					var dayHourly = day.hourly || [];
					var astro = (day.astronomy && day.astronomy[0]) ? day.astronomy[0] : {};
					var dSunrise = fmt12(astro.sunrise) || "06:00";
					var dSunset = fmt12(astro.sunset) || "19:00";

					var dayHours = [];
					var srM = (function(v) { var p = String(v).split(":"); return (+p[0]) * 60 + (+p[1] || 0); })(dSunrise);
					var ssM = (function(v) { var p = String(v).split(":"); return (+p[0]) * 60 + (+p[1] || 0); })(dSunset);
					for (var h = 0; h < 24; h++) {
						var b = dayHourly[Math.min(dayHourly.length - 1, Math.floor(h / 3))] || {};
						var hh = Math.floor(h / 3) * 3;
						var isDayH = (hh * 60 >= srM && hh * 60 < ssM) ? 1 : 0;
						dayHours.push({
							hour: String(h),
							temp: Math.round(iv(b.tempC, temp)),
							icon: get_wttr_icon(b.weatherCode, isDayH),
							wind_speed: Math.round((iv(b.windspeedKmph, 0) / 3.6) * 10) / 10,
							wind_angle: Math.round(iv(b.winddirDegree, 0)),
							humidity: Math.round(iv(b.humidity, 50)),
							pressure_mm: Math.round(iv(b.pressure, 1013) * 0.750062)
						});
					}

					var max_t = Math.round(iv(day.maxtempC, dayHours[13].temp));
					var min_t = Math.round(iv(day.mintempC, dayHours[1].temp));
					var m_t = Math.round(iv((dayHourly[3] || {}).tempC, max_t));
					var e_t = Math.round(iv((dayHourly[6] || {}).tempC, max_t));

					var dParts = {
						morning: {temp_avg: m_t, icon: dayHours[9].icon, wind_speed: dayHours[9].wind_speed, wind_angle: dayHours[9].wind_angle},
						day: {temp_avg: max_t, icon: dayHours[13].icon, wind_speed: dayHours[13].wind_speed, wind_angle: dayHours[13].wind_angle},
						evening: {temp_avg: e_t, icon: dayHours[18].icon, wind_speed: dayHours[18].wind_speed, wind_angle: dayHours[18].wind_angle},
						night: {temp_avg: min_t, icon: dayHours[1].icon, wind_speed: dayHours[1].wind_speed, wind_angle: dayHours[1].wind_angle}
					};

					forecasts_list.push({
						date: day.date || "",
						sunrise: dSunrise,
						sunset: dSunset,
						moon_code: 9,
						hours: dayHours,
						parts: dParts
					});
				}

				var converted = {
					fact: {
						temp: temp,
						icon: icon,
						wind_speed: wind_speed,
						wind_angle: wind_angle,
						humidity: humidity,
						pressure_mm: pressure_mm
					},
					forecasts: forecasts_list
				};

				on_success(converted);
			} catch(ex) {
				console.error("wttr.in parse error:", ex);
				on_error(null, "parse_error", ex ? ex.message : "parse error");
			}
		},
		error: function(xhr, status, err) {
			console.log("wttr.in request failed:", status, err);
			on_error(xhr, status, err);
		}
	});
}

window.onload = function() {
	update_viewport_metrics();
	$(window).on('resize orientationchange', update_viewport_metrics);
	setTimeout(function() { $(window).trigger('resize'); }, 500);
	setTimeout(function() { $(window).trigger('resize'); }, 2000);
	date = new Date();
	now = Date.now();
	$('.value').each(function() {
		value[$(this).attr('id')] = {'visible': 0, 'data': null, 'type': this.hasAttribute('data-type') ? $(this).attr('data-type') : 'value'};
	});
	$('body').click(function(){fullscreen()});
	init_menu();

	// 1. Попытка восстановить погоду из localStorage
	var restored = false;
	try {
		var cached = localStorage.getItem("weather_cache_data");
		if (cached) {
			var parsed = JSON.parse(cached);
			if (parsed.hasOwnProperty("fact") && parsed.hasOwnProperty("forecasts")) {
				current_weather_data = parsed;
				restored = true;
				console.log("Restored weather from localStorage cache");
			}
		}
	} catch (e) {
		console.error("Error reading localStorage:", e);
	}

	function finishInit() {
		load_config(function() {
			if (current_weather_data) {
				render_weather(current_weather_data);
			}
			update_status_bar();
			run();
		});
	}

	// 2. Если в localStorage пусто, проверяем резервный weather_cache.json
	if (!restored) {
		$.getJSON("weather_cache.json")
			.done(function(cachedJson) {
				if (cachedJson && cachedJson.fact && cachedJson.forecasts) {
					current_weather_data = cachedJson;
					try {
						localStorage.setItem("weather_cache_data", JSON.stringify(cachedJson));
						if (!localStorage.getItem("weather_cache_time")) {
							localStorage.setItem("weather_cache_time", String(Date.now()));
						}
						if (!localStorage.getItem("weather_cache_source")) {
							localStorage.setItem("weather_cache_source", "Яндекс.Погода");
						}
					} catch(e) {}
					console.log("Restored weather from weather_cache.json");
				}
			})
			.always(function() {
				finishInit();
			});
	} else {
		finishInit();
	}
}

// Мигание двоеточий без CSS-анимации: 1 перерисовка в секунду вместо
// непрерывного invalidate (на software-rendered webview экономит ~40% CPU)
setInterval(function() {
	var colons = document.querySelectorAll('.colon');
	for (var i = 0; i < colons.length; i++) {
		colons[i].style.visibility = (colons[i].style.visibility === 'hidden') ? 'visible' : 'hidden';
	}
}, 1000);

function run() {
	date = new Date();
	now = Date.now();
	var data = {
		hours: String(pad(date.getHours())),
		minutes: String(pad(date.getMinutes())),
		date: day[date.getDay()] + ', ' + String(pad(date.getDate())) + '.' + String(pad(date.getMonth() + 1)) + '.' + String(date.getFullYear()).slice(-2)
	};
	
	var storedLastCall = parseInt(safe_get_item("weather_last_call", "0"), 10);
	if (storedLastCall > lastcall) lastcall = storedLastCall;

	if (lastcall < now - timeout * 1000 && (server_url.trim() !== '' || api != 'xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx')) {
		get_data();
	}

	// Динамически пересчитываем прогноз и проверяем актуальность кэша каждую минуту
	if (current_weather_data) {
		render_weather(current_weather_data);
	} else {
		update_status_bar();
	}

	update(data);
	
	interval = 60 * 1000;
	timer = Math.ceil(now / interval) * interval + 1000 - now;
	setTimeout(function(){run()}, timer);
}

function get_data() {
	now = Date.now();
	lastcall = now;
	try {
		localStorage.setItem("weather_last_call", String(now));
		localStorage.setItem("weather_last_attempt_time", String(now));
	} catch(e) {}

	var server = (server_url && server_url.trim() !== "") ? server_url.trim() : '';

	// Выбор источника из меню (localStorage weather_source_pref): default = обычная цепочка
	var source_pref = safe_get_item("weather_source_pref", "default");
	if (source_pref !== "server" && source_pref !== "wttr") source_pref = "default";
	var only_server = (source_pref === "server");

	if (source_pref === "wttr") {
		console.log("get_data: source pref = wttr.in (direct)");
		if (!enable_wttr_fallback) {
			show_error(null, "source_disabled", "источник wttr.in отключён конфигом");
			return;
		}
		fetch_from_wttr(function(wt_data) {
			current_weather_data = wt_data;
			try {
				localStorage.setItem('weather_cache_data', JSON.stringify(wt_data));
				localStorage.setItem('weather_cache_time', String(Date.now()));
				localStorage.setItem('weather_cache_source', 'wttr.in');
				localStorage.removeItem('weather_last_attempt_error');
			} catch (e) {}
			render_weather(wt_data);
			update_status_bar();
		}, function(wt_xhr, wt_status, wt_err) {
			show_error(wt_xhr, wt_status, wt_err, "wttr.in");
		});
		return;
	}

	if (only_server && !server) {
		console.log("get_data: source pref = Local server, but server_url is not set");
		show_error(null, "no_server_url", "источник «Локальный сервер»: server_url не задан");
		return;
	}

	var primary_url, headers, is_direct_yandex;
	if (server) {
		primary_url = server;
		headers = {};
		is_direct_yandex = false;
	} else if (allow_direct_yandex) {
		primary_url = 'https://api.weather.yandex.ru/v2/forecast?lat=' + lat + '&lon=' + lon;
		headers = {'X-Yandex-Weather-Key': api};
		is_direct_yandex = true;
	} else {
		console.log("server_url is not set and allow_direct_yandex=false, going to wttr.in fallback");
		on_failure(null, "no_server_url", "server_url не задан, прямой Яндекс запрещен конфигом", false);
		return;
	}

	console.log("get_data CALLED, target: " + primary_url);

	function fetch_url(url, req_headers, is_fallback) {
		$.ajax({
			url: url,
			headers: req_headers,
			dataType: 'json',
			timeout: 25 * 1000,
			success: function(result) {
				console.log("get_data SUCCESS from " + url + ":", JSON.stringify(result).substring(0, 100));
				if (result.hasOwnProperty('fact') && result.hasOwnProperty('forecasts')) {
					current_weather_data = result;
					var sourceName = is_direct_yandex ? 'Яндекс.Погода' : 'Локальный сервер';
					try {
						localStorage.setItem('weather_cache_data', JSON.stringify(result));
						localStorage.setItem('weather_cache_time', String(Date.now()));
						localStorage.setItem('weather_cache_source', sourceName);
						localStorage.removeItem('weather_last_attempt_error');
					} catch (e) {
						console.error("Failed to write localStorage cache:", e);
					}
					render_weather(result);
					update_status_bar();
				} else {
					on_failure(null, "format", "неверный формат данных", is_fallback);
				}
			},
			error: function(xhr, status, err) {
				console.log("get_data ERROR from " + url + ":", status, err, xhr ? xhr.status : 0);
				on_failure(xhr, status, err, is_fallback);
			}
		});
	}

	function on_failure(xhr, status, err, is_fallback) {
		if (!is_fallback && server && allow_direct_yandex && !only_server) {
			console.log("Local server failed, trying direct Yandex API fallback (allowed by config)...");
			var fallback_url = 'https://api.weather.yandex.ru/v2/forecast?lat=' + lat + '&lon=' + lon;
			fetch_url(fallback_url, {'X-Yandex-Weather-Key': api}, true);
			return;
		}

		if (owm_key && !only_server) {
			console.log("Trying OpenWeatherMap client fallback...");
			fetch_from_owm(on_success, on_error);
			return;
		}

		if (enable_wttr_fallback && !only_server) {
			console.log("Yandex API unavailable/failed, trying wttr.in fallback...");
			fetch_from_wttr(function(wt_data) {
				console.log("wttr.in fallback SUCCESS");
				current_weather_data = wt_data;
				try {
					localStorage.setItem('weather_cache_data', JSON.stringify(wt_data));
					localStorage.setItem('weather_cache_time', String(Date.now()));
					localStorage.setItem('weather_cache_source', 'wttr.in');
					localStorage.removeItem('weather_last_attempt_error');
				} catch (e) {}
				render_weather(wt_data);
				update_status_bar();
			}, function(wt_xhr, wt_status, wt_err) {
				console.log("wttr.in fallback also failed");
				show_error(xhr, status, err);
			});
			return;
		}

		show_error(xhr, status, err);
	}

	fetch_url(primary_url, headers, false);
}

function parse(data) {
	render_weather(data);
}

function render_weather(data) {
	if (!data || !data.fact) return;

	var cacheTime = parseInt(safe_get_item("weather_cache_time", "0"), 10);
	var nowMs = Date.now();
	if (cacheTime > 0 && (nowMs - cacheTime > max_cache_age_ms)) {
		update_status_bar();
		return;
	}

	date = new Date();
	now = Date.now();
	var curHour = date.getHours();
	var result = {};

	// 1. Определение активного дня прогноза по календарной дате устройства
	var activeForecastIdx = 0;
	if (data.forecasts && data.forecasts.length > 0) {
		var padZero = function(n) { return (n < 10 ? '0' : '') + n; };
		var todayDateStr = date.getFullYear() + '-' + padZero(date.getMonth() + 1) + '-' + padZero(date.getDate());
		for (var fi = 0; fi < data.forecasts.length; fi++) {
			if (data.forecasts[fi].date === todayDateStr) {
				activeForecastIdx = fi;
				break;
			}
		}
	}
	var fToday = (data.forecasts && data.forecasts[activeForecastIdx]) ? data.forecasts[activeForecastIdx] : (data.forecasts ? data.forecasts[0] : null);
	var fTomorrow = (data.forecasts && data.forecasts[activeForecastIdx + 1]) ? data.forecasts[activeForecastIdx + 1] : fToday;

	// 2. Почасовая подстановка для текущего часа при автономной работе (>1ч без свежей сети)
	var isOfflineHours = (cacheTime > 0 && (nowMs - cacheTime > 3600 * 1000));
	var hourForecast = null;
	if (fToday && fToday.hours && fToday.hours.length > 0) {
		for (var hi = 0; hi < fToday.hours.length; hi++) {
			if (parseInt(fToday.hours[hi].hour, 10) === curHour) {
				hourForecast = fToday.hours[hi];
				break;
			}
		}
		if (!hourForecast && fToday.hours[curHour]) {
			hourForecast = fToday.hours[curHour];
		}
	}

	if (isOfflineHours && hourForecast) {
		if (hourForecast.hasOwnProperty('icon')) result.icon = icon_daynight(hourForecast.icon, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunrise : null, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunset : null);
		else if (data.fact.hasOwnProperty('icon')) result.icon = icon_daynight(data.fact.icon, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunrise : null, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunset : null);

		if (hourForecast.hasOwnProperty('temp')) result.temperature = (hourForecast.temp > 0 ? '+' : '') + hourForecast.temp;
		else if (data.fact.hasOwnProperty('temp')) result.temperature = (data.fact.temp > 0 ? '+' : '') + data.fact.temp;

		if (hourForecast.hasOwnProperty('wind_speed')) {
			result.wind = hourForecast.wind_speed;
			result.wind_progress = 'width: ' + (100 - Math.round(hourForecast.wind_speed / wind_max * 100)) + '%';
			if (hourForecast.hasOwnProperty('wind_angle')) result.wind_icon = 'transform: rotate(' + (hourForecast.wind_angle - 180) + 'deg)';
		} else if (data.fact.hasOwnProperty('wind_speed')) {
			result.wind = data.fact.wind_speed;
			result.wind_progress = 'width: ' + (100 - Math.round(data.fact.wind_speed / wind_max * 100)) + '%';
			if (data.fact.hasOwnProperty('wind_angle')) result.wind_icon = 'transform: rotate(' + (data.fact.wind_angle - 180) + 'deg)';
		}

		if (hourForecast.hasOwnProperty('humidity')) {
			result.humidity = hourForecast.humidity;
			result.humidity_progress = 'width: ' + (100 - hourForecast.humidity) + '%';
		} else if (data.fact.hasOwnProperty('humidity')) {
			result.humidity = data.fact.humidity;
			result.humidity_progress = 'width: ' + (100 - data.fact.humidity) + '%';
		}

		if (hourForecast.hasOwnProperty('pressure_mm')) {
			result.pressure = hourForecast.pressure_mm;
		} else if (data.fact.hasOwnProperty('pressure_mm')) {
			result.pressure = data.fact.pressure_mm;
		} else if (data.hasOwnProperty('info') && data.info.hasOwnProperty('def_pressure_mm')) {
			result.pressure = data.info.def_pressure_mm;
		}
		if (result.pressure !== undefined) {
			if (result.pressure < pressure_min) result.pressure_progress = 0;
			else if (result.pressure > pressure_max) result.pressure_progress = 100;
			else result.pressure_progress = Math.round((result.pressure - pressure_min) / (pressure_max - pressure_min) * 100);
			result.pressure_progress = 'width: ' + (100 - result.pressure_progress) + '%';
		}
	} else {
		// Свежий факт
		if (data.fact.hasOwnProperty('icon')) result.icon = icon_daynight(data.fact.icon, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunrise : null, (data.forecasts && data.forecasts[0]) ? data.forecasts[0].sunset : null);
		if (data.fact.hasOwnProperty('temp')) result.temperature = (data.fact.temp > 0 ? '+' : '') + data.fact.temp;
		if (data.fact.hasOwnProperty('wind_speed')) {
			result.wind = data.fact.wind_speed;
			result.wind_progress = 'width: ' + (100 - Math.round(data.fact.wind_speed / wind_max * 100)) + '%';
			if (data.fact.hasOwnProperty('wind_angle')) result.wind_icon = 'transform: rotate(' + (data.fact.wind_angle - 180) + 'deg)';
		}
		if (data.fact.hasOwnProperty('humidity')) {
			result.humidity = data.fact.humidity;
			result.humidity_progress = 'width: ' + (100 - data.fact.humidity) + '%';
		}
		if (data.fact.hasOwnProperty('pressure_mm')) {
			result.pressure = data.fact.pressure_mm;
		} else if (data.hasOwnProperty('info') && data.info.hasOwnProperty('def_pressure_mm')) {
			result.pressure = data.info.def_pressure_mm;
		}
		if (result.pressure !== undefined) {
			if (result.pressure < pressure_min) result.pressure_progress = 0;
			else if (result.pressure > pressure_max) result.pressure_progress = 100;
			else result.pressure_progress = Math.round((result.pressure - pressure_min) / (pressure_max - pressure_min) * 100);
			result.pressure_progress = 'width: ' + (100 - result.pressure_progress) + '%';
		}
	}

	// 3. Min и Max по часам активного дня
	if (fToday && fToday.hasOwnProperty('hours') && fToday.hours.length > 0) {
		var min = 0, max = 0;
		for (var id = 0; id < fToday.hours.length; id++) {
			if (fToday.hours[id].hasOwnProperty('temp')) {
				if (fToday.hours[id].temp < fToday.hours[min].temp) min = id;
				if (fToday.hours[id].temp > fToday.hours[max].temp) max = id;
			}
		}
		result.min = (fToday.hours[min].temp > 0 ? '+' : '') + fToday.hours[min].temp;
		var minH = (fToday.hours[min].hour !== undefined) ? parseInt(fToday.hours[min].hour, 10) : min;
		result.min_date = String(pad(minH)) + ':00';
		result.max = (fToday.hours[max].temp > 0 ? '+' : '') + fToday.hours[max].temp;
		var maxH = (fToday.hours[max].hour !== undefined) ? parseInt(fToday.hours[max].hour, 10) : max;
		result.max_date = String(pad(maxH)) + ':00';
	}

	// 4. Прогнозные слоты («Днём», «Вечером», «Ночью», «Утром»)
	var partsConfig = [];
	if (curHour >= 6 && curHour <= 11) {
		partsConfig = [
			{obj: fToday, period: 'day'},
			{obj: fToday, period: 'evening'}
		];
	} else if (curHour >= 12 && curHour <= 17) {
		partsConfig = [
			{obj: fToday, period: 'evening'},
			{obj: fTomorrow, period: 'night'}
		];
	} else if (curHour >= 18 && curHour <= 22) {
		partsConfig = [
			{obj: fTomorrow, period: 'night'},
			{obj: fTomorrow, period: 'morning'}
		];
	} else {
		partsConfig = [
			{obj: fToday, period: 'morning'},
			{obj: fToday, period: 'day'}
		];
	}

	for (var pid = 0; pid < partsConfig.length; pid++) {
		var fObj = partsConfig[pid].obj;
		var targetPeriod = partsConfig[pid].period;
		if (fObj && fObj.hasOwnProperty('parts') && fObj.parts.hasOwnProperty(targetPeriod)) { 
			result['forecast_title_' + pid] = period[targetPeriod];
			if (fObj.parts[targetPeriod].hasOwnProperty('icon')) {
				result['forecast_icon_' + pid] = fObj.parts[targetPeriod].icon;
			}
			if (fObj.parts[targetPeriod].hasOwnProperty('temp_avg')) {
				var t = fObj.parts[targetPeriod].temp_avg;
				result['forecast_temperature_' + pid] = (t > 0 ? '+' : '') + t;
			}
			if (fObj.parts[targetPeriod].hasOwnProperty('wind_speed')) {
				result['forecast_wind_' + pid] = fObj.parts[targetPeriod].wind_speed;
			}
			if (fObj.parts[targetPeriod].hasOwnProperty('wind_angle')) {
				result['forecast_wind_icon_' + pid] = 'transform: rotate(' + (fObj.parts[targetPeriod].wind_angle - 180) + 'deg)';
			}
		}
	}

	// 5. Астрономия (Луна, Восход, Закат)
	if (fToday && fToday.hasOwnProperty('moon_code')) result.moon = 'moon_' + fToday.moon_code;
	else if (data.forecasts && data.forecasts[0] && data.forecasts[0].hasOwnProperty('moon_code')) result.moon = 'moon_' + data.forecasts[0].moon_code;

	if (fToday && fToday.hasOwnProperty('sunrise') && fToday.hasOwnProperty('sunset')) {
		result.rise = fToday.sunrise;
		result.set = fToday.sunset;
		riseset(result.rise, result.set);
	} else if (data.forecasts && data.forecasts[0] && data.forecasts[0].hasOwnProperty('sunrise')) {
		result.rise = data.forecasts[0].sunrise;
		result.set = data.forecasts[0].sunset;
		riseset(result.rise, result.set);
	}

	update(result);
	update_status_bar();
}

function riseset(rise, set) {
	if (!rise || !set) return;
	var result = {};
	rise = rise.split(':');
	set =  set.split(':');
	rise = Number(rise[0]) * 60 + Number(rise[1]);
	set = Number(set[0]) * 60 + Number(set[1]);
	duration = set - rise;
	current = date.getHours() * 60 + date.getMinutes();
	hour = Math.floor(duration / 60);
	result.duration_hour = String(pad(hour));
	result.duration_minute = String(pad(duration - hour * 60));
	result.duration_time = 'width: ' + Math.round((duration / (60 * 24) * 100)) + '%; left: ' + Math.round(rise / (60 * 24) * 100) + '%';
	result.duration_progress = 'width: ' + Math.round(current / (60 * 24) * 100) + '%';
	if (current > rise && current < set) {
		minutes = set - current;
		result.duration_left = period.day_day;
	} else {
		minutes = 60 * 24 - current + rise;
		result.duration_left = period.day_night;
	}
	hours = Math.floor(minutes / 60);
	result.duration_left += ' ' + String(pad(hours)) + ':' + String(pad(minutes - hours * 60));
	update(result);
}

function update(result) {
	for (var id in value) {
		if (result.hasOwnProperty(id)) {
			result[id] = String(result[id]).replace(/[\'\"\\<>]/g, '');
			if (result[id] !== value[id].data) {
				switch (value[id].type) {
					case 'value':
						$('#' + id).html(result[id]);
					break;
					case 'class':
						$('#' + id).removeClass(value[id].data).addClass(result[id]);
					break;
					case 'style':
						$('#' + id).attr('style', result[id]);
					break;
				}
				value[id].data = result[id];
			}
			value[id].update = now;
			if (value[id].visible == 0) {
				value[id].visible = 1;
				$('.sector_' + id).addClass('visible');
			}
		}
		if (value[id].update < (now - expire * 1000)) {
			if (value[id].visible == 1) {
				value[id].visible = 0;
				$('.sector_' + id).removeClass('visible');
			}
		}
	}
}

function pad(n) {
	return n < 10 ? '0' + n : n;
}

function fullscreen() {
	var e = document.documentElement;
	if (e.requestFullscreen && !document.fullscreenElement) e.requestFullscreen();
	else if (e.webkitRequestFullscreen && !document.webkitFullscreenElement) e.webkitRequestFullscreen();
}

@media (orientation: landscape) {
	html, body {
		width: 100vw;
		height: 100vh;
		overflow: hidden;
		background: #000;
		margin: 0;
		padding: 0;
	}
	#wrapper {
		display: flex !important;
		flex-direction: column !important;
		width: 100vw !important;
		height: 100vh !important;
		box-sizing: border-box !important;
		padding: 0 !important;
		position: static !important;
		background: #000 !important;
	}
	.spacer {
		padding-bottom: 0 !important;
		margin-bottom: 0 !important;
	}

	/* TOP SECTION: Maximum Width Clock & Date */
	#datetime {
		width: 100% !important;
		height: 46vh !important;
		display: flex !important;
		flex-direction: column !important;
		justify-content: center !important;
		align-items: center !important;
		position: static !important;
		margin: 0 !important;
		padding: 1.0vh 0 0.4vh 0 !important;
		overflow: hidden !important;
		border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
		box-sizing: border-box !important;
	}
	html.has_system_bar #datetime {
		padding-top: 1.8vh !important;
	}
	#wrapper.weather_stale #datetime {
		height: 88vh !important;
		border-bottom: none !important;
	}
	#wrapper.weather_stale #time {
		font-size: 30vw !important;
	}
	#time {
		position: static !important;
		font-size: 22.0vw !important;
		line-height: 0.90 !important;
		letter-spacing: -0.4vw !important;
		transform: none !important;
		top: auto !important;
		left: auto !important;
		margin: 0 !important;
		font-weight: 500 !important;
		white-space: nowrap !important;
		display: flex !important;
		flex-direction: row !important;
		align-items: center !important;
		justify-content: center !important;
	}
	#time .colon {
		display: inline-block !important;
		margin: 0 0.5vw !important;
		-webkit-transform: translateY(-0.6vw) !important;
		transform: translateY(-0.6vw) !important;
	}
	#date {
		position: static !important;
		font-size: 3.6vw !important;
		line-height: 1.1 !important;
		transform: none !important;
		top: auto !important;
		left: auto !important;
		width: auto !important;
		margin-top: 0.4vh !important;
		font-weight: 500 !important;
		opacity: 0.9 !important;
	}

	/* Completely collapse invisible sectors so they take 0 space in flex layout */
	[class*="sector_"]:not(.visible),
	#wind_humidity_pressure div[class*="sector_"]:not(.visible),
	#wind_humidity_pressure .wind_humidity_pressure_bar[class*="sector_"]:not(.visible) {
		display: none !important;
		height: 0 !important;
		margin: 0 !important;
		padding: 0 !important;
		border: none !important;
	}

	/* BOTTOM SECTION: 2 Columns (Left: Current Weather, Right: Forecast & Astro) */
	#weather_body {
		display: flex !important;
		flex-direction: row !important;
		width: 100% !important;
		height: 54vh !important;
		box-sizing: border-box !important;
	}

	/* LEFT COLUMN: Current Weather (aligned with forecast at top and flush to bottom) */
	#now {
		width: 50% !important;
		height: 100% !important;
		position: static !important;
		display: flex !important;
		flex-direction: column !important;
